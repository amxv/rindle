[package]
name = "rindle"
version = "0.1.2"
edition = "2024"
rust-version = "1.99.1"
description = "Private two-way Safari and Chromium history sync for macOS"
license = "Apache-2.0"
repository = "https://github.com/amxv/rindle"
homepage = "https://rindle.ashray.xyz"
readme = "README.md"
publish = false
include = ["/src/**", "/extension/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]
keywords = ["history", "safari", "chromium", "sync"]
categories = ["command-line-utilities"]

[package.metadata.dist]
dist = true

[[bin]]
name = "rindle"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Fast local development defaults; use `--profile debugging` when full debug
# information is actually needed.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dist]
inherits = "release"
