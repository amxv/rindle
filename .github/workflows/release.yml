# macOS distribution: ad-hoc-signed sandboxed helper and Rust CLI bundled
# together in one SHA-256-verified tarball per architecture.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Package CLI and ad-hoc-signed sandboxed app
        shell: bash
        run: ./scripts/package-release.sh '${{ matrix.target }}'

      - name: Smoke test checksummed archive and installer
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          archive="target/distrib/rindle-${TARGET}.tar.gz"
          (cd target/distrib && shasum -a 256 -c "rindle-${TARGET}.tar.gz.sha256")
          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT

          # Installed into an isolated location. No Safari permissions,
          # LaunchAgents, or user browser history touched on CI.
          RINDLE_LOCAL_ARCHIVE="$GITHUB_WORKSPACE/$archive" \
          RINDLE_INSTALL_DIR="$smoke/bin" \
          RINDLE_APP_DIR="$smoke/appdata" \
          RINDLE_INSTALL_SKIP_SETUP=1 \
            sh docs/public/install.sh

          "$smoke/bin/rindle" --version
          "$smoke/bin/rindle" setup --help | grep -q -- '--scoped-helper'
          app="$smoke/appdata/ScopedSafariHelper.app"
          test -x "$app/Contents/MacOS/RindleScopedProbe"
          codesign --verify --strict --deep "$app"
          signature=$(codesign -dv --verbose=2 "$app" 2>&1)
          [[ "$signature" == *'Signature=adhoc'* ]]
          case "$TARGET" in
            aarch64-apple-darwin) arch=arm64 ;;
            x86_64-apple-darwin) arch=x86_64 ;;
          esac
          lipo "$smoke/bin/rindle" -verify_arch "$arch"
          lipo "$app/Contents/MacOS/RindleScopedProbe" -verify_arch "$arch"
          if find "$smoke" -name 'History.db' -o -name '*.sqlite' | grep -q .; then
            echo 'Release installer must not bundle Safari databases' >&2
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: rindle-${{ matrix.target }}
          path: |
            target/distrib/rindle-${{ matrix.target }}.tar.gz
            target/distrib/rindle-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: rindle-*-apple-darwin
          path: dist
          merge-multiple: true

      - name: Require both macOS architectures and their SHA-256 sidecars
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            test -s "dist/rindle-${target}.tar.gz"
            test -s "dist/rindle-${target}.tar.gz.sha256"
            (cd dist && sha256sum -c "rindle-${target}.tar.gz.sha256")
          done
          cp docs/public/install.sh dist/rindle-installer.sh
          chmod 755 dist/rindle-installer.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "Rindle $GITHUB_REF_NAME" \
            --generate-notes \
            dist/rindle-aarch64-apple-darwin.tar.gz \
            dist/rindle-aarch64-apple-darwin.tar.gz.sha256 \
            dist/rindle-x86_64-apple-darwin.tar.gz \
            dist/rindle-x86_64-apple-darwin.tar.gz.sha256 \
            dist/rindle-installer.sh
