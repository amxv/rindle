name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "Justfile"
      - "src/**"
      - "tests/**"
      - "extension/**"
      - "apps/**"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "Justfile"
      - "src/**"
      - "tests/**"
      - "extension/**"
      - "apps/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extension tests
        run: node --test extension/*.test.mjs

      - name: Compile sandboxed Safari helper
        run: ./apps/scoped-safari/build.sh

      - name: Validate signed macOS release archive and installer
        run: |
          ./scripts/package-release.sh aarch64-apple-darwin
          (cd target/distrib && shasum -a 256 -c rindle-aarch64-apple-darwin.tar.gz.sha256)
          mkdir -p "$RUNNER_TEMP/helper-check"
          tar -xzf target/distrib/rindle-aarch64-apple-darwin.tar.gz -C "$RUNNER_TEMP/helper-check"
          codesign --verify --strict "$RUNNER_TEMP/helper-check/rindle-aarch64-apple-darwin/ScopedSafariHelper.app"
          signature=$(codesign -dv --verbose=2 "$RUNNER_TEMP/helper-check/rindle-aarch64-apple-darwin/ScopedSafariHelper.app" 2>&1)
          [[ "$signature" == *'Signature=adhoc'* ]]
          RINDLE_LOCAL_ARCHIVE="$GITHUB_WORKSPACE/target/distrib/rindle-aarch64-apple-darwin.tar.gz" \
          RINDLE_INSTALL_DIR="$RUNNER_TEMP/rindle-cli" RINDLE_APP_DIR="$RUNNER_TEMP/rindle-app" \
          RINDLE_INSTALL_SKIP_SETUP=1 sh docs/public/install.sh
