name: CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "dist-workspace.toml"
      - "Justfile"
      - "src/**"
      - "tests/**"
      - "extension/**"
      - "experiments/**"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "dist-workspace.toml"
      - "Justfile"
      - "src/**"
      - "tests/**"
      - "extension/**"
      - "experiments/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extension tests
        run: node --test extension/*.test.mjs

      - name: Compile restricted Safari folder-access experiment
        run: ./experiments/scoped-safari/build.sh

      - name: Validate universal scoped Safari helper archive (development only)
        run: |
          ./scripts/package-scoped-helper.sh --development
          (cd target/distrib && shasum -a 256 -c rindle-scoped-helper-universal.zip.sha256)
          mkdir -p "$RUNNER_TEMP/helper-check"
          ditto -x -k target/distrib/rindle-scoped-helper-universal.zip "$RUNNER_TEMP/helper-check"
          codesign --verify --strict "$RUNNER_TEMP/helper-check/ScopedSafariHelper.app"
          lipo -archs "$RUNNER_TEMP/helper-check/ScopedSafariHelper.app/Contents/MacOS/RindleScopedProbe" | grep -q arm64
          lipo -archs "$RUNNER_TEMP/helper-check/ScopedSafariHelper.app/Contents/MacOS/RindleScopedProbe" | grep -q x86_64
